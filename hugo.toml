[outputs]
home = [ "HTML", "RSS", "JSON" ]

[params]
env = "production"
description = "Theme PaperMod - https://github.com/adityatelange/hugo-PaperMod"
author = "Marcos Filho"
defaultTheme = "auto"
ShowShareButtons = true
ShowReadingTime = true
displayFullLangName = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowRssButtonInSectionTermList = true
ShowAllPagesInArchive = true
ShowPageNums = true
ShowToc = true
images = [ "images/papermod-cover.png" ]

  [params.profileMode]
  enabled = false
  title = "PaperMod"
  imageUrl = "#"
  imageTitle = "my image"

    [[params.profileMode.buttons]]
    name = "Archives"
    url = "archives"

    [[params.profileMode.buttons]]
    name = "Tags"
    url = "tags"

  [params.homeInfoParams]
  Title = "Engenheiro de Software"
  Content = """
- Olá, meu nome é Marcos Filho, um engenheiro de software com mais de 11 anos na area 
e apaixonado por criar soluções para a web. Com experiência em diversas tecnologias, 
estou sempre em busca de novos desafios para aprender 
e crescer na área de desenvolvimento 💻
"""

  [[params.socialIcons]]
  name = "github"
  title = "View Source on Github"
  url = "https://github.com/maaarkin"

  [[params.socialIcons]]
  name = "linkedin"
  title = "View my profile on LinkedIn"
  url = "https://www.linkedin.com/in/m-filhow/"

#   [params.editPost]
#   URL = "https://github.com/adityatelange/hugo-PaperMod/tree/exampleSite/content"
#   Text = "Suggest Changes"
#   appendFilePath = false

  [params.assets]
  disableHLJS = true

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false

[services.instagram]
disableInlineCSS = true

[services.x]
disableInlineCSS = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'