baseURL = "https://maaarkin.github.io/"
title = "Marcos Filho"
copyright = "© [PaperMod Contributors](https://github.com/adityatelange/hugo-PaperMod/graphs/contributors)"
theme = [ "PaperMod" ]
enableInlineShortcodes = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true
mainsections = [ "posts", "papermod" ]

[minify]
disableXML = true

[pagination]
disableAliases = false
pagerSize = 5

[languages.en]
languageName = "English"
weight = 1

  [languages.en.taxonomies]
  category = "categories"
  tag = "tags"
  series = "series"

[[languages.en.menu.main]]
# name = "NullLink"
url = "#"

  [languages.en.params]
  languageAltTitle = "English"

    [languages.en.params.profileMode]
    enabled = false
    title = "Marcos Filho"
    imageUrl = "https://avatars.githubusercontent.com/u/178929251?v=4"
    imageTitle = "ProfileMode image"
    subtitle = "☄️ Fast | ☁️ Fluent | 🌙 Smooth | 📱 Responsive"

      [[languages.en.params.profileMode.buttons]]
      name = "Blog"
      url = "posts"

      [[languages.en.params.profileMode.buttons]]
      name = "Profile Mode"
      url = "https://github.com/adityatelange/hugo-PaperMod/wiki/Features#profile-mode"

